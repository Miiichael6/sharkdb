[package]
name = "sharkdb"
version = "0.1.5"
description = "SharkDB"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sharkdb_lib"
# Desktop-only: staticlib/cdylib are only needed for Android/iOS builds and add ~300 MB to target/.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["full"] }
mongodb = "2.8"
dirs = "7"
futures = "0.3.34"
rquickjs = "0.14.0"
base64 = "0.22"
md-5 = "0.10"
tauri-plugin-dialog = "2"
russh = { version = "0.65.0", default-features = false, features = ["ring", "rsa", "flate2"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
oxc_parser = "0.156.0"
oxc_allocator = "0.156.0"
oxc_ast = "0.156.0"
oxc_span = "0.156.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencies (the Mongo driver, BSON, QuickJS) optimized in dev builds too: unoptimized, queries run
# several times slower. Our own crate stays at the dev default, so it still rebuilds fast.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Line tables are enough for readable panic backtraces; full debuginfo bloats target/ by tens of GB.
[profile.dev]
debug = "line-tables-only"
