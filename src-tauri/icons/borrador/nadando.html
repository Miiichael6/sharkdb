    animation: rays 9s ease-in-out infinite alternate; }

  .fin { transform-origin: 560px 605px; animation: flap .9s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }
  .bubble { position: fixed; bottom: -30px; border-radius: 50%;
    border: 2px solid rgba(143,211,255,.5); animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-115vh) translateX(30px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .swim { left: 25vw; } }
